name: Release staleness check

# SUR-1070 follow-up. Every other gate in this repo asks whether the tree is CONSISTENT. None asks
# whether consistent, finished work is STUCK — and braird-core ships through two hops that are both
# manual on purpose: merge → release tag, then release tag → `braird-core.lock` in each app repo.
# No floating versions in a crypto core, and the pin PR is the integration gate (docs/pinning.md).
# Both hops are right; neither had a clock on it. SUR-1070's note-tombstoning fix merged, was
# released, and the only thing that surfaced "this is still not on a phone" was a human asking.
#
# `scripts/check-release-staleness.mjs` carries the rules and the reasoning; this file only feeds it.
#
# NOT a merge-path gate, deliberately — there is no `pull_request` trigger. "You have not shipped
# this yet" is never a reason to reject the next commit, so this runs on a clock and reports.
#
# Daily, unlike the Monday drift checks. Its tightest deadline is 7 days, and a weekly cadence would
# make that up to 14 in practice — a deadline the schedule cannot actually enforce is decoration.
# Cost is one Node run plus two shallow clones.
#
# REQUIRES the `CONSUMER_PINS_READ_PAT` secret: a read-only PAT with `contents: read` on
# braird/braird-android and braird/braird-ios, which are PRIVATE. Deliberately NOT `SURFC_READ_PAT`
# — that one is scoped to braird/surfc, and widening it would extend an unrelated workflow's reach
# to two more repositories to save creating one secret. Each cross-repo reader gets its own.
#
# braird-core is a PUBLIC repository, so holding a PAT for private repos here deserves a sentence.
# Secrets are not exposed to workflows triggered from forks, and this workflow has no
# `pull_request` trigger at all — chosen above for a different reason, but it also means no
# fork-controlled run can ever reach this secret. Keep it that way: adding a `pull_request` trigger
# here would change the security posture, not just the cadence.

# CodeQL (actions/missing-workflow-permissions) on PR #93: pin the GITHUB_TOKEN down rather than
# inheriting the repository default. `contents: read` is the whole requirement — the checkout, and
# the `gh api .../releases` call below. This job never writes anything.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 9 * * *' # daily 09:00 UTC
  # A change to the checker or this workflow exercises it immediately, matching the other drift
  # checks — the rules are only trustworthy if editing them runs them.
  push:
    paths:
      - 'scripts/check-release-staleness.mjs'
      - '.github/workflows/release-staleness.yml'
  workflow_dispatch:

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the checker dates the last release from its tag, and dates unreleased
      # security work by walking the CHANGELOG commits since that tag. A shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Self-check the rules before applying them
        run: node scripts/check-release-staleness.mjs --self-check

      # A TAG IS NOT A RELEASE (Codex on PR #93). `release.yml` publishes create-only at the END of
      # its job DAG, so a tag whose build failed leaves a tag with no release behind it. The checker
      # judges every version against THIS list, never against `git tag`, so that state is reported
      # instead of silently reading as shipped. One page of 100 is the ceiling and is ~6x the
      # release history; paginate here if that ever stops being true.
      - name: Fetch the published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases?per_page=100" > /tmp/releases.json

      # Read-only, and the checker needs exactly one file from each. `|| true` is deliberate: a
      # clone that fails (revoked PAT, missing scope, outage) must surface as a FINDING from the
      # checker — "pin could not be read" — not as a green run that silently checked nothing.
      - name: Fetch the consumer pins
        env:
          PAT: ${{ secrets.CONSUMER_PINS_READ_PAT }}
        run: |
          mkdir -p /tmp/consumers
          if [ -z "$PAT" ]; then
            echo "::error::CONSUMER_PINS_READ_PAT is not set — the consumer-pin signal cannot run."
            echo "::error::Create a read-only PAT with contents:read on braird-android + braird-ios."
          fi
          for repo in braird-android braird-ios; do
            git clone --depth 1 --quiet \
              "https://x-access-token:${PAT}@github.com/braird/${repo}.git" \
              "/tmp/consumers/${repo}" || echo "::warning::could not clone ${repo} — the checker will report it"
          done

      - name: Assert nothing finished is stuck
        run: node scripts/check-release-staleness.mjs --releases /tmp/releases.json --consumers /tmp/consumers
