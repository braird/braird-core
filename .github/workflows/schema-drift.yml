name: Synced-schema drift check

# SUR-723 §7. Fails the build if the vendored synced-schema fixture diverges from
# surfc/main — i.e. if a synced column was added, removed, or retyped in surfc's
# `supabase.js` upsert* payloads (the synced set) or its migrations (the types)
# without the native SQLite mirror being re-vendored. This is the silent-desync guard:
# without it, a new synced column (the `content_tag`/SUR-638 case) would round-trip in
# the PWA but be dropped on native, undetectably.
#
# The single source of truth is surfc; this repo vendors a DERIVED fixture
# (vendored/schema/sync-schema.json) and `scripts/extract-sync-schema.mjs` re-derives it
# from surfc/main here to prove the copy is current. Sibling of vendored-drift.yml (which
# byte-diffs the crypto vectors); the schema is derived, not copied, so it runs the
# extractor in --check mode rather than a raw diff.
#
# Requires the SURFC_READ_PAT secret (cross-repo read-only PAT).

on:
  # Per-PR (SUR-723 Gate-2 remediation): re-derive the fixture from surfc/main on every PR
  # to main — so a PR that edits the mirror (src/store.rs) WITHOUT touching the fixture is
  # still cross-checked, and the "per-PR" guarantee is real. Cheap (clone + node ~10s).
  pull_request:
    branches: [main]
  # On push to the guarded paths (a fixture / script / workflow change on any branch).
  push:
    paths:
      - 'vendored/schema/**'
      - 'scripts/extract-sync-schema.mjs'
      - 'scripts/check-native-schema.mjs'
      - 'scripts/check-native-schema.test.mjs'
      - 'scripts/logical-type.mjs'
      - '.github/workflows/schema-drift.yml'
  # Weekly: the only trigger that catches surfc-side drift when NO PR here touches anything
  # (surfc adds a synced column while this repo is static) — the cross-repo case a per-PR
  # trigger alone cannot see.
  schedule:
    - cron: '0 9 * * 1' # Monday 09:00 UTC (with the crypto drift check)
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — skip until the fixture is vendored
        id: guard
        run: |
          if [ -f vendored/schema/sync-schema.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No vendored/schema/sync-schema.json yet — nothing to drift-check."
          fi

      - name: Set up Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      # Shallow clone of surfc/main — the extractor reads only src/supabase.js (the synced
      # column set) + supabase/migrations (the types). A plain depth-1 checkout is robust;
      # sparse cone-mode rejects a single-file path, and the repo is small enough at depth 1.
      - name: Fetch surfc/main sources
        if: steps.guard.outputs.ready == 'true'
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.SURFC_READ_PAT }}@github.com/braird/surfc.git" \
            /tmp/surfc

      - name: Assert sync-schema.json has not drifted from surfc/main
        if: steps.guard.outputs.ready == 'true'
        run: node scripts/extract-sync-schema.mjs /tmp/surfc --check vendored/schema/sync-schema.json

  # SUR-1048. The native-first tables (SUR-996) have no surfc counterpart, so there is nothing to
  # re-derive: `native_schema()` in src/store.rs is the source of truth and
  # vendored/schema/native-schema.json is a hand-authored lock of it, reconciled by
  # tests/schema_parity.rs on every `cargo test`. This job covers the one thing the Rust build
  # cannot see — the DDL actually applied to braird-staging. A migration written but never applied
  # (or applied with a different type) is invisible everywhere else in the stack. `native-prod`
  # below runs the same check against production, on the weekly cron only.
  #
  # No surfc clone: this leg talks to the database, not to the PWA. Runs on the same triggers as
  # the derived leg — per-PR (a fixture edit is checked immediately) plus the weekly cron, which is
  # the only trigger that catches STAGING-side drift while this repo sits still, exactly as the
  # weekly surfc re-derivation catches PWA-side drift.
  native:
    name: native-first schema lock vs braird-staging
    runs-on: ubuntu-latest
    # Least privilege (CodeQL actions/missing-workflow-permissions): this job only reads the repo
    # and a DB secret — it never writes to GitHub, so the token needs nothing beyond checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      # The DDL leg only ever executes against a real Supabase project, so its comparison logic
      # (missing column, retyped column, RLS off, a stale backend:pending row) would otherwise ship
      # having never run. These exercise it against recorded information_schema payloads — and,
      # since SUR-1076, the wrong-database guard both legs now depend on.
      - name: Unit-check the gate's own comparison logic
        run: node --test scripts/check-native-schema.test.mjs

      # Preinstalled on ubuntu-latest; asserted explicitly so a runner-image change is diagnosed
      # here rather than as a confusing spawn failure inside the script.
      - name: Assert the psql client is available
        run: psql --version

      - name: Assert native-schema.json matches braird-staging's information_schema
        env:
          # SUR-1076 parameterised this script over more than one project, so the leg must now
          # DECLARE which database it believes the secret points at. The script refuses to run if
          # the URI carries a different project's ref — without that, wiring this leg to the wrong
          # secret would report green having proved the other database twice.
          BRAIRD_DB_TARGET: braird-staging
          # Secret referenced by name only (GATING §4). The script reads it from the environment,
          # never from argv, and redacts it out of any psql error before printing. It fails closed
          # when unset — no skip path, because a schema gate that passes without opening a
          # connection is worse than no gate.
          #
          # Holds a SESSION-POOLER URI for the dedicated read-only `schema_checker` role (not the
          # migration/service credential — this job only reads catalogs). If it ever reports every
          # column of a live table as missing, suspect the grant before the schema:
          # information_schema.columns is privilege-filtered, and tables created AFTER the role's
          # GRANT need ALTER DEFAULT PRIVILEGES to be visible at all.
          BRAIRD_DB_URL: ${{ secrets.BRAIRD_STAGING_DB_URL }}
        run: node scripts/check-native-schema.mjs --check

  # SUR-1076. The same gate, against PRODUCTION. Everything above proves braird-staging only, and
  # SUR-1049's behavioural round-trip runs on an ephemeral local stack — so before this job nothing
  # in the stack watched the database real users sync against. Migrations 0055 + 0056 were applied
  # to production by hand on 2026-08-20; a hand-applied migration is exactly the case this checker
  # exists for, because written, merged and applied are three different states.
  #
  # The risk is not a missing feature. As of v0.15.0 the three native-first tables are in the pull
  # scope, and per SUR-736 a failed pull aborts the account's WHOLE flush — so a production-pointed
  # native build hitting a missing table has broken sync on every table, not just this one.
  #
  # Deliberately NOT a matrix leg of the job above, and deliberately NOT run per-PR. Production
  # lags staging by design (SUR-1047 held prod until clients shipped), so the next native-first
  # table will be `backend: live` and present on staging while production has not been migrated
  # yet. On a per-PR trigger that state turns every unrelated core PR red until someone applies a
  # migration in another repo. Weekly is the right cadence for drift nobody is actively causing —
  # and a separate job means a skipped run reads as SKIPPED, never as a green gate that never ran.
  native-prod:
    name: native-first schema lock vs braird-prod
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      # No unit-check step here: the job above already runs it on every trigger this job fires on.

      - name: Assert the psql client is available
        run: psql --version

      - name: Assert native-schema.json matches braird-prod's information_schema
        env:
          BRAIRD_DB_TARGET: braird-prod
          # Same environment-scoped handling as the staging secret: a SESSION-POOLER URI for the
          # dedicated read-only `schema_checker` role, never the migration/service credential.
          # Fails closed when unset — there is no skip path.
          BRAIRD_DB_URL: ${{ secrets.BRAIRD_PROD_DB_URL }}
        run: node scripts/check-native-schema.mjs --check
